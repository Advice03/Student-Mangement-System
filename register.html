<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | StudentMS</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<header class="site-header"><a class="brand" href="index.html">🎓 Student<span class="brand-blue">MS</span></a><button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="index.html#about">About</a><a href="index.html#features">Features</a><a href="login.html">Login</a><a class="nav-cta active" href="register.html">Register</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="auth-symbol">✨</div><span class="eyebrow">JOIN STUDENTMS</span><h1>Create your account</h1><p class="muted">Fill in the details below to get started.</p>
<form id="registerForm">
<div class="form-group"><label for="registerName">Full name</label><input type="text" id="registerName" autocomplete="name" required minlength="2" placeholder="Your full name"></div>
<div class="form-group"><label for="registerEmail">Email address</label><input type="email" id="registerEmail" autocomplete="email" required placeholder="you@example.com"></div>
<div class="form-group"><label for="registerPassword">Password</label><input type="password" id="registerPassword" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"></div>
<div class="form-group"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" autocomplete="new-password" required minlength="6" placeholder="Repeat your password"></div>
<p id="registerMessage" class="form-message" role="status"></p><button class="btn btn-primary full-width" type="submit">Create account →</button>
</form><p class="auth-switch">Already registered? <a href="login.html">Login here</a></p><p class="auth-back"><a href="index.html">← Back to home</a></p></section></main>
<footer class="mini-footer">© 2026 StudentMS · Learning project</footer><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
