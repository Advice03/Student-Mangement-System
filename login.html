<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | StudentMS</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<header class="site-header"><a class="brand" href="index.html">🎓 Student<span class="brand-blue">MS</span></a><button class="menu-toggle" aria-label="Toggle navigation" onclick="toggleMenu()">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Home</a><a href="index.html#about">About</a><a href="index.html#features">Features</a><a class="active" href="login.html">Login</a><a class="nav-cta" href="register.html">Register</a></nav></header>
<main class="auth-wrap"><section class="auth-card"><div class="auth-symbol">🎓</div><span class="eyebrow">WELCOME BACK</span><h1>Sign in to StudentMS</h1><p class="muted">Enter your account details to continue.</p>
<form id="loginForm">
<div class="form-group"><label for="loginEmail">Email address</label><input type="email" id="loginEmail" autocomplete="email" required placeholder="you@example.com"></div>
<div class="form-group"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required placeholder="Enter your password"></div>
<p id="loginMessage" class="form-message" role="status"></p><button class="btn btn-primary full-width" type="submit">Login to your account →</button>
</form><p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p><p class="auth-back"><a href="index.html">← Back to home</a></p></section></main>
<footer class="mini-footer">© 2026 StudentMS · Learning project</footer><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
